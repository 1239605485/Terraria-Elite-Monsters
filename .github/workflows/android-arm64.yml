name: Build Origin Rewrite Android ARM64

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Show NDK path
        run: |
          echo "ndk-path=${{ steps.setup-ndk.outputs.ndk-path }}"
          ls -1 "${{ steps.setup-ndk.outputs.ndk-path }}" || true

      - name: Show build tools
        run: |
          set -euo pipefail
          echo "runner-os=$(uname -a)"
          echo "cmake=$(cmake --version | head -n 1)"
          echo "ninja=$(ninja --version 2>/dev/null || true)"
          test -n "${{ steps.setup-ndk.outputs.ndk-path }}"
          test -f "${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake"

      - name: Build and package ARM64
        shell: bash
        run: |
          set -o pipefail
          bash scripts/package_android_arm64.sh 2>&1 | tee "${RUNNER_TEMP}/originrewrite-build.log"
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: originrewrite-build-diagnostics
          path: |
            ${{ runner.temp }}/originrewrite-build.log
            build-android-arm64/CMakeCache.txt
            build-android-arm64/CMakeFiles/CMakeOutput.log
            build-android-arm64/CMakeFiles/CMakeError.log
          if-no-files-found: warn

      - name: Upload installable artifact
        uses: actions/upload-artifact@v4
        with:
          name: OriginRewrite-android-arm64-installable
          path: OriginRewrite-android-arm64.zip
