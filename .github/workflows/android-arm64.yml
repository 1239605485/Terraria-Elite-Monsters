name: Build EliteMonsters Android ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - 'EliteMonsters/**'
      - '.github/workflows/android-arm64.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK and NDK
        run: |
          JAVA17=$(ls -d /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17*/x64 | sort -V | tail -n 1)
          echo "JAVA_HOME=$JAVA17" >> "$GITHUB_ENV"
          echo "PATH=$JAVA17/bin:$PATH" >> "$GITHUB_ENV"
          NDK_DIR=$(ls -d "$ANDROID_SDK_ROOT"/ndk/* | sort -V | tail -n 1)
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Using NDK: $NDK_DIR"

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24

      - name: Build
        run: cmake --build build --config Release --target EliteMonsters -j2

      - name: Assemble mod package
        run: |
          mkdir -p package/Resources/lib
          cp EliteMonsters/Manifest.json package/Manifest.json
          cp EliteMonsters/Info.json package/Info.json
          cp EliteMonsters/EliteMonsters.json package/EliteMonsters.json
          cp build/EliteMonsters/libEliteMonsters.android.arm64.so package/Resources/lib/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EliteMonsters-android-arm64
          path: package
